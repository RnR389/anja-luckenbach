        const sichtbar = feld.type === "password";
        feld.type = sichtbar ? "text" : "password";
        zeigen.setAttribute("aria-pressed", String(sichtbar));
        zeigen.setAttribute("aria-label", sichtbar ? "Passwort verbergen" : "Passwort zeigen");
        zeigen.querySelector(".auge").classList.toggle("hidden", sichtbar);
        zeigen.querySelector(".auge-zu").classList.toggle("hidden", !sichtbar);
        feld.focus();
      });

      document.getElementById("staticrypt-form").addEventListener("submit", async function (e) {
        e.preventDefault();
        fehler.classList.add("hidden");
        const merken = document.getElementById("staticrypt-remember").checked;
        const { isSuccessful } = await staticrypt.handleDecryptionOfPage(feld.value, merken);
        if (!isSuccessful) {
          fehler.classList.remove("hidden");
          feld.select();
        }
      });
    </script>
  </body>
</html>
